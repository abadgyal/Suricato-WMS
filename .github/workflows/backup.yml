# Backup diario de la base de datos (pg_dump) → artefacto del workflow.
#
# SECRETS que hay que configurar en GitHub
# (Settings → Secrets and variables → Actions → New repository secret):
#
#   SUPABASE_DB_URL  Cadena de conexión Postgres del proyecto Supabase.
#                    Supabase → Project Settings → Database → Connection string (URI).
#                    Formato: postgresql://postgres:CONTRASEÑA@HOST:5432/postgres
#                    Es un SECRETO: contiene la contraseña de la BD. Nunca en el repo.
#
# El volcado se guarda como artefacto del propio run (retención configurable abajo),
# no en el repositorio.

name: Backup diario de la BD

on:
  schedule:
    # Todos los días a las 03:17 UTC. (Hora "rara" para no coincidir con los picos
    # de carga de GitHub Actions a las horas en punto.)
    - cron: '17 3 * * *'
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que el secret está configurado
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL. Configúralo en Settings → Secrets → Actions."
            exit 1
          fi

      - name: pg_dump de la base de datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Se usa pg_dump desde una imagen postgres:17 para que la versión del cliente
          # case con la del servidor Supabase y evitar el error de "server version
          # mismatch". La URL se pasa por variable de entorno (-e) y se expande DENTRO
          # del contenedor (sh -c '...'), nunca en la línea de `docker run` del host,
          # para que no aparezca en la lista de procesos.
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          echo "dump_file=backup-${STAMP}.sql" >> "$GITHUB_ENV"
          docker run --rm -e PGCONNECT_TIMEOUT=30 -e SUPABASE_DB_URL \
            postgres:17 \
            sh -c 'pg_dump --no-owner --no-privileges "$SUPABASE_DB_URL"' > "backup-${STAMP}.sql"
          echo "Tamaño del volcado:"
          ls -lh "backup-${STAMP}.sql"

      - name: Subir el volcado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.dump_file }}
          path: ${{ env.dump_file }}
          # Retención en días del artefacto (máx. permitido por el plan del repo).
          retention-days: 30
          if-no-files-found: error
